name: AI Daily Learning Plan

on:
  schedule:
    # 美东 8:00 AM = UTC 13:00（夏令时）/ UTC 13:00（冬令时 UTC+5 = 13:00）
    - cron: '0 13 * * *'   # research.py：收集研究 + 发摘要邮件
    # 美东 12:00 PM = UTC 17:00
    - cron: '0 17 * * *'   # wait_reply.py：检查回复 + 生成学习计划
  workflow_dispatch:        # 允许手动点击触发（方便测试）

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run research.py (08:00 ET)
        if: github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_PORT: "465"
          IMAP_PORT: "993"
        run: python research.py

      - name: Run wait_reply.py (12:00 ET)
        if: github.event.schedule == '0 17 * * *'
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_PORT: "465"
          IMAP_PORT: "993"
        run: python wait_reply.py
